name: Deploy portfolio

on:
  push:
    branches: [main]

jobs:
  # ── 1. Unit tests (Jest + RTL) ─────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── 2. E2E tests (Playwright) ──────────────────────────────────────────────
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 3. Deploy (only runs if both test jobs pass) ───────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: portfolio
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          NEXT_PUBLIC_UMAMI_URL: ${{ vars.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_ID: ${{ vars.NEXT_PUBLIC_UMAMI_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NEXT_PUBLIC_UMAMI_URL,NEXT_PUBLIC_UMAMI_ID
          script: |
            set -e
            cd /root/portfolio
            git pull origin main

            cat > .env.production <<EOF
            NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL}
            NEXT_PUBLIC_UMAMI_ID=${NEXT_PUBLIC_UMAMI_ID}
            EOF

            docker compose --env-file .env.production up -d --build